<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoganails Gestione - Demo pannello gestionale salone | Francesco Folino</title>
<meta name="description" content="Pannello gestionale per saloni: richieste, calendario, orari di lavoro e foto del sito. Progetto demo di Francesco Folino.">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="barra-laterale">
            <div class="logo">💅 Shoganails</div>
            <nav>
                <button class="voce-nav attiva" data-tab="richieste">📥 Richieste</button>
                <button class="voce-nav" data-tab="calendario">📅 Calendario</button>
                <button class="voce-nav" data-tab="settimana">🕒 Orari di lavoro</button>
                <button class="voce-nav" data-tab="foto">🖼️ Foto</button>
            </nav>
        </aside>

        <main class="contenuto">
            <section id="tab-richieste" class="tab attiva">
                <h1>Richieste in arrivo</h1>
                <div id="lista-richieste" class="lista-richieste"></div>
            </section>

            <section id="tab-calendario" class="tab">
                <h1>Calendario prenotazioni</h1>
                <div id="lista-calendario" class="lista-calendario"></div>
            </section>

            <section id="tab-settimana" class="tab">
                <h1>Orari di lavoro</h1>
                <form id="form-orari" class="scheda-upload">
                    <p>Inserisci i tuoi orari della settimana: le clienti potranno prenotare solo negli slot liberi.</p>
                    <div id="righe-orari" class="slot-settimana"></div>
                    <button type="submit" class="bottone-primario">Salva orari</button>
                    <div id="stato-orari" class="stato-ia" role="status" hidden></div>
                </form>
            </section>

            <section id="tab-foto" class="tab">
                <h1>Foto del sito</h1>
                <div id="griglia-foto" class="griglia-foto"></div>
                <button id="bottone-aggiungi-foto" class="bottone-primario">+ Aggiungi foto</button>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
